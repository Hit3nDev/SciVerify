# SciVerify — verification configuration

nli:
  # Switched from facebook/bart-large-mnli (~400M params) to a much lighter
  # MNLI-finetuned model after Phase 5's first real run showed bart-large
  # taking a very long time per claim on CPU with no progress feedback --
  # a genuine mismatch with research spec section 9 ("models that can
  # realistically run on a student machine"). cross-encoder/nli-MiniLM2-L6-H768
  # (~22M params) is a standard, widely-used lightweight NLI model; same
  # entailment/contradiction/neutral output space, loaded the same way.
  # Swap back to bart-large-mnli (or a domain-tuned model) later as an
  # ablation once this lighter baseline's numbers exist to compare against.
  model_name: "cross-encoder/nli-MiniLM2-L6-H768"
  batch_size: 8
  # Raw NLI model output labels -> SciVerify's RawLabel-equivalent verdicts.
  # bart-large-mnli outputs: contradiction, neutral, entailment
  label_map:
    entailment: SUPPORT
    contradiction: CONTRADICT
    neutral: NEI

baseline_c:
  # Baseline C = "dense retrieval + NLI" per the research spec (section 4).
  # We nonetheless default the *retriever actually used for this baseline's
  # evidence* to BM25, because Phase 4 showed dense retrieval underperforming
  # BM25 on this dataset — using dense here would confound "does NLI help"
  # with "the evidence retrieval was worse to begin with". This is a
  # documented substitution, not a silent one. Set to "dense" to run the
  # baseline as originally specified for direct comparison.
  retriever: bm25
  evidence_top_k: 3   # number of top-retrieved abstracts fed to the NLI stage

aggregation:
  # How per-document NLI labels combine into one claim verdict.
  # See verification/aggregate.py for the conflicting-evidence logic
  # required by research spec section 12.
  min_confidence_for_verdict: 0.5

proposed:
  # Proposed system = hybrid retrieval + sentence-level evidence selection + NLI
  # + conflict-aware aggregation. Every component can be switched off from the
  # command line (see experiments/run_proposed.py) so the ablation study can
  # measure what each one actually contributes.
  retrieval: hybrid        # bm25 | dense | hybrid
  evidence_top_k: 3        # documents passed to the NLI stage
  sentence_selection: true # false = feed the whole abstract, as in Baseline C
  sentences_per_doc: 2

demo:
  # The demo/API run the best system found in the evaluation (Baseline C): BM25 + whole-abstract NLI.
  # The default model is facebook/bart-large-mnli because the original accuracy numbers were measured with it.
  nli_model: "facebook/bart-large-mnli"
  evidence_top_k: 3
  # Every judge the web app can switch between. The first entry is the default. `path` is a hub id or a
  # local directory; a judge whose directory does not exist (not trained yet) is simply not offered.
  judges:
    - key: bart
      path: "facebook/bart-large-mnli"
      name: "General judge (bart-large-mnli)"
      description: "407M parameters, trained on everyday English inference, never saw a scientific claim."
    - key: scifact
      path: "models/nli-scifact"
      name: "Science-trained judge (MiniLM, fine-tuned)"
      description: "82M parameters, fine-tuned on SciFact's 809 training claims by experiments/finetune_nli.py."
    - key: minilm
      path: "cross-encoder/nli-MiniLM2-L6-H768"
      name: "Small general judge (MiniLM, untrained)"
      description: "The same 82M model before fine-tuning, to show what the training changed."
  # Fitted temperatures per judge (experiments/calibrate.py writes this file). Missing = no calibrated score.
  calibration_file: "models/calibration.json"
